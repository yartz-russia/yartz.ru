<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YARTZ — Перенаправление...</title>
    
    <!-- Мета-тег для мгновенного редиректа -->
    <meta http-equiv="refresh" content="0; url=https://live.yartz.ru/">
    <meta name="robots" content="noindex, follow">

    <!-- Фавикон -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mainbg: '#313131',
                        cardbg: '#252525',
                        brand: '#60E4EE',
                        brandhover: '#42c9d3'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Orbitron', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #313131;
            color: #FFFFFF;
            font-family: 'Inter', sans-serif;
        }

        .glow-brand {
            box-shadow: 0 0 20px rgba(96, 228, 238, 0.2);
            border-color: #60E4EE;
        }

        /* Анимация пульсации лоадера */
        .pulse-glow {
            animation: pulse-glow-anim 2s infinite ease-in-out;
        }
        @keyframes pulse-glow-anim {
            0%, 100% { box-shadow: 0 0 15px rgba(96, 228, 238, 0.3); transform: scale(1); }
            50% { box-shadow: 0 0 30px rgba(96, 228, 238, 0.6); transform: scale(1.03); }
        }
    </style>
</head>
<body class="min-h-screen bg-mainbg flex items-center justify-center p-4">

    <main class="w-full max-w-md bg-cardbg border-2 border-brand/80 rounded-2xl p-6 sm:p-8 text-center glow-brand shadow-2xl relative overflow-hidden">
        
        <!-- Логотип -->
        <div class="mb-6 flex justify-center">
            <img src="https://i.postimg.cc/X7gtYcjr/logomini.png" alt="YARTZ Logo" class="h-12 sm:h-14 w-auto object-contain" onerror="this.onerror=null; this.src='https://placehold.co/140x48/252525/60E4EE?text=YARTZ';">
        </div>

        <!-- Иконка загрузки -->
        <div class="w-16 h-16 mx-auto mb-6 rounded-full bg-brand/10 border border-brand/40 flex items-center justify-center text-brand text-2xl pulse-glow">
            <i class="fa-solid fa-arrows-rotate animate-spin"></i>
        </div>

        <!-- Заголовок -->
        <h1 class="font-heading text-xl sm:text-2xl font-bold text-white mb-2 tracking-wide uppercase">
            Перенаправление
        </h1>
        
        <p class="text-sm text-gray-400 mb-6 leading-relaxed">
            Перенаправляем вас на live.yartz.ru...
        </p>

        <!-- Прямая кнопка-ссылка -->
        <a href="https://live.yartz.ru/" class="inline-flex items-center justify-center gap-2.5 w-full py-3.5 px-6 rounded-xl font-bold text-mainbg bg-brand hover:bg-brandhover transition-all duration-300 shadow-lg text-sm sm:text-base transform hover:-translate-y-0.5">
            <span>Перейти прямо сейчас</span>
            <i class="fa-solid fa-arrow-right"></i>
        </a>

    </main>

    <script>
        // Моментальный JS-редирект на случай, если мета-тег сработает медленнее
        window.location.replace("https://live.yartz.ru/");
    </script>
</body>
</html>
